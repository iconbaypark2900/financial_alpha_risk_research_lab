version: 1
# Rewritten 2026-08-28. The previous contents were template output from the
# project generator whose scaffolding commit 6eb543f removed: it ranked "add
# retrieval quality checks" and "prototype semantic retrieval behind the
# baseline" for a repository that has no retrieval, no index and no UI. Its
# stated purpose is to make recommendations evidence-based rather than
# chat-history-based, and it was the single most authoritative-looking wrong
# document in the tree. Only "resolve dirty working tree" was correct, and that
# is now done.
#
# State at rewrite: V0 feature-complete, 249 tests passing, Alpha exit criteria
# met. Everything below is scoped against PRD 04 rather than against a template.
tasks:
  - id: recommended
    label: "V1 — portfolio construction, starting by verifying finGuard's math"
    kind: recommended
    score: 15
    agents: ["hermes", "codex", "testing-hardening"]
    why: >
      The next buildable phase. FR-19 is data-gated, so this is what is actually
      unblocked. migration_inbox/finGuard/ holds Kelly, drawdown, a Monte Carlo
      simulator and a Plotly visualiser. The "23 tests green" in the liaison
      brief is true and misleading: those tests cover kelly.py and drawdown.py
      (302 lines); simulator.py (231 lines) is untested, and visualizer.py (426
      lines) is untested AND does not import — it needs plotly, which is not a
      dependency here. Two thirds of the code is unverified.
      Do NOT start from finGuard's todo.md: it is AI-generated self-assessment
      ("Excellent Scaffolding", "Perfect modular architecture") rating its own
      gaps as LOW, with exactly the standing the NautilusTrader docstring had.
      Start by checking Kelly and drawdown against their sources the way core.py
      was checked against Bailey and Lopez de Prado. Drop visualizer.py and
      app.py rather than migrating them: a Streamlit UI is not portfolio
      construction, and the README declines UI work for an internal tool.

  - id: near-2
    label: "Close FR-19's partial-fill half with order-book data"
    kind: near
    score: 12
    agents: ["codex", "testing-hardening"]
    why: >
      The only V0 requirement still open. Market orders against daily bars fill
      in full even at 100x the bar's volume, because a bar carries no depth to
      consume; partial fills need L2/L3 data this project does not have. Likely
      a procurement question before it is an engineering one.
      tests/test_backtest.py pins the limitation and will fail once it changes.

  - id: near-3
    label: "Pass the Beta gate (financial-alpha-beta-gate-001)"
    kind: near
    score: 11
    agents: ["spark-flow-closeout"]
    why: >
      All three Alpha exit criteria in PROJECT_PHASE.md are now met. The gate
      task was queued in the L5 flywheel section of the liaison brief and has
      been waiting on the criteria rather than on anything else.
