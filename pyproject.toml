# Project metadata, dependencies and tool configuration.
#
# ON THE PACKAGE BEING NAMED `src`
#
# The import path is `src.research_integrity`, so the installed top-level
# package is literally `src` — a generic name that would be antisocial on PyPI.
# It is kept because this is an internal tool that is never published, the
# README documents that import path throughout, and renaming it is a change to
# the public API rather than a packaging detail. If this ever becomes a library,
# the move is `src/research_integrity` -> `research_integrity/` at the root, and
# it is mechanical.
#
# DEPENDENCIES ARE DECLARED TWICE, ON PURPOSE
#
# Here, and in requirements.txt — which carries the reasoning for each one and
# the list of what was deliberately removed. Two sources of truth is normally
# how drift starts, so `tests/test_packaging.py` fails when they disagree.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-alpha-risk-research-lab"
version = "0.1.0"
description = "A quantitative research platform whose design goal is making the strategies it finds believable"
readme = "README.md"
# 3.12, not 3.11. Nothing here uses syntax newer than 3.11 and every module
# compiles under 3.13 — but numpy and nautilus_trader both require >=3.12, so a
# 3.11 floor would be a claim that fails at `pip install`. nautilus_trader also
# caps at <3.15, which bites only the `engine` extra. The CI matrix checks the
# range rather than leaving it asserted in a metadata file.
requires-python = ">=3.12"

# Core is numpy alone, and that is not a simplification: the suite runs 421 of 601 tests with nothing else installed. duckdb and nautilus_trader are
# import-guarded, their slices skip when absent, and modelling them as required
# would misdescribe a configuration this project actually supports and tests.
dependencies = [
    "numpy>=1.21.0",
]

[project.optional-dependencies]
# The point-in-time store. Without it, PointInTimeStore is None.
store = ["duckdb>=1.0.0"]
# The event-driven backtest engine. Without it, run_backtest is None.
engine = ["nautilus_trader>=1.231.0"]
dev = ["pytest>=7.0.0"]
# Everything, matching requirements.txt. Listed explicitly rather than by
# self-reference so it works on older pip.
all = ["duckdb>=1.0.0", "nautilus_trader>=1.231.0", "pytest>=7.0.0"]

[tool.setuptools]
packages = ["src", "src.research_integrity", "src.portfolio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Without this the suite runs only when pytest is invoked from the repository
# root: `pytest /path/to/repo/tests` from anywhere else failed with
# "No module named 'src'". A test suite that works under one invocation is a
# test suite most CI configurations will not run.
pythonpath = ["."]

# ONE UPSTREAM DEPRECATION, NAMED — NOT A BLANKET `ignore`
#
# The suite emitted 50 `Pandas4Warning: Timestamp.utcnow is deprecated`, every
# one of them reported against `engine.run()` in this project's own files. The
# attribution is wrong and it is what makes a blanket `ignore` tempting. The
# deprecated call is `pd.Timestamp.utcnow()` inside nautilus_trader's compiled
# `backtest/engine.pyx` (lines 1418 and 1601 in 1.231.0); this project never
# imports pandas, and its own `_utcnow()` helpers use `datetime.now(timezone
# .utc)`. Cython frames are invisible to `sys._getframe`, so the warnings
# machinery walks past engine.pyx and blames the nearest Python frame.
#
# So the filter matches the MESSAGE, and deliberately not the module: the only
# module names that would work are `src.research_integrity.backtest` and
# `tests.test_backtest` — ours — and scoping by them would hide every future
# deprecation this project's backtest code raises about itself. The message is
# matched by prefix (`re.match`), stopping before "Use Timestamp.now('UTC')"
# because pytest treats the field as a regex and those parentheses are a group.
# The category is DeprecationWarning, which Pandas4Warning subclasses, rather
# than `pandas.errors.Pandas4Warning`: naming it would make the minimal install
# — numpy alone, no pandas — fail at startup with UsageError under the
# pytest>=7.0.0 this project declares.
#
# tests/test_warning_filters.py executes this entry both ways: the upstream
# warning must be silenced, and a warning from this project's own code must not.
filterwarnings = [
    "ignore:Timestamp\\.utcnow is deprecated:DeprecationWarning",
]
